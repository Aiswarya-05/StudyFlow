
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | StudyFlow</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="edit-task-container">
        <section class="edit-task-card">
            <h1>Edit Task</h1>
            <p>Update your task details.</p>

            {% if error %}
                <p class="task-error">{{ error }}</p>
            {% endif %}

            <form method="POST">
                <label for="task">Task name</label>
                <input type="text" id="task" name="task"
                       value="{{ task['task'] }}"
                       maxlength="200" required>

                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="High"
                        {% if task['priority'] == 'High' %}selected{% endif %}>
                        High
                    </option>
                    <option value="Medium"
                        {% if task['priority'] == 'Medium' %}selected{% endif %}>
                        Medium
                    </option>
                    <option value="Low"
                        {% if task['priority'] == 'Low' %}selected{% endif %}>
                        Low
                    </option>
                </select>

                <label for="deadline">Deadline</label>
                <input type="date" id="deadline" name="deadline"
                       value="{{ task['deadline'] or '' }}">

                <label for="reminder_at">Reminder</label>
                <input type="datetime-local"
                       id="reminder_at" name="reminder_at"
                       value="{{ task['reminder_at'] or '' }}">

                <div class="edit-task-actions">
                    <button type="submit" class="primary-button">
                        Save Changes
                    </button>
                    <a href="{{ url_for('home') }}"
                       class="secondary-button">Cancel</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
